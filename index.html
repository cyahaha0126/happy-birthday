<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>一烨知秋纪事录</title>
<meta name="description" content="一烨知秋（T.枫烨 × T.01）B站直播回放泡泡墙月历，点泡泡或搜索事件即可跳到录屏对应时间点。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700;900&family=Figtree:wght@300;500;800&family=JetBrains+Mono:wght@500&display=swap">
<style>
html{-webkit-text-size-adjust:100%}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
/* 一烨知秋纪事录 · 版面： 泡泡墙月历 — two chapters that slide left/right: 2025-10-30 → 2026-06-27, then 2026-10-29 → latest replay (chapter two shows only days with replays), 31 staggered bubbles per column like bubble wrap; detail panel sits beside it on wide screens and below it on phones. Deliberately single (light) theme: a cream paper poster. */
:root{
  color-scheme:light;
  --paper:#FFFBE0;        /* 奶黄底 */
  --sheet:#FFFDF0;
  --moon:#FFE38A;         /* 月亮黄 / 泡泡外圈 */
  --moon-deep:#F2C94C;
  --ink:#141414;
  --muted:#6B6550;
  --faint:#B9B39A;
  --line:#EFE6BC;
  --bubble:#FFFFFF;
  --c1:#2F6FED; --c2:#F2852E; --c3:#F29DC0; --c4:#2FA65A; --c5:#8A63D2; --c6:#E2483D;
  --f-title:"Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif;
  --f-num:"Figtree","Helvetica Neue",Arial,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  --b:clamp(30px, calc((100vw - 40px) / 10.2), 46px);   /* bubble size */
  --gy:6px;                                              /* vertical gap */
}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--f-title);font-size:15px;line-height:1.6;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 60px}
button,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}

.page{max-width:1080px;margin:0 auto}

/* masthead */
.mast{position:relative;padding-block:34px 18px;min-height:150px}
.moon{position:absolute;left:-6px;top:22px;width:118px;height:118px;pointer-events:none}
.mast h1{position:relative;margin:46px 0 0 20px;font-weight:900;font-size:clamp(30px,6.5vw,44px);letter-spacing:.02em;line-height:1.15}
.mast .sub{position:relative;margin:6px 0 0 22px;font-size:13px;color:var(--muted);display:flex;gap:14px;flex-wrap:wrap}

/* toolbar */
.tools{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:6px}
.search{flex:1 1 260px;min-width:0;display:flex;align-items:center;gap:8px;background:var(--sheet);border:2px solid var(--moon);border-radius:999px;padding:0 16px}
.search input{border:0;outline:0;background:transparent;padding:10px 0;width:100%;min-width:0}
.search svg{flex:none;color:var(--muted)}
.count{font-size:13px;color:var(--muted);width:100%}

/* layout */
.main{display:grid;grid-template-columns:auto minmax(0,1fr);gap:32px;align-items:start;margin-top:22px}
@media (max-width:900px){.main{grid-template-columns:minmax(0,1fr)}}

/* poster */
.poster{overflow:hidden;min-width:0}
.track{display:flex;width:200%;align-items:flex-start;transition:transform .6s cubic-bezier(.65,0,.25,1)}
.track.p2{transform:translateX(-50%)}
.pg{width:50%;overflow-x:auto;padding-bottom:6px}
.pg[inert]{visibility:hidden;max-height:0;transition:visibility 0s .6s,max-height 0s .6s}
.chbtn{border:2px solid var(--moon);background:var(--sheet);border-radius:999px;padding:3px 12px;cursor:pointer;font-weight:700;font-size:13px;color:var(--ink)}
.chbtn:hover{background:var(--moon)}
.chbtn{white-space:nowrap}
.back-col{height:118px;display:flex;align-items:flex-end;padding-bottom:6px;margin-left:calc(var(--b) * .5)}
.wall{display:flex;gap:calc(var(--b) * .12);width:max-content;margin:0}
.col{display:flex;flex-direction:column;align-items:center;width:var(--b)}
.col-head{height:118px;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:4px;padding-bottom:8px}
.yr{font-family:var(--f-num);font-weight:800;font-size:15px;line-height:1.02;display:flex;flex-direction:column;align-items:center}
.mo{font-family:var(--f-num);font-weight:500;font-size:14px}
.cells{display:flex;flex-direction:column;gap:var(--gy)}
.col.odd .cells{padding-top:calc((var(--b) + var(--gy)) / 2)}
.bub{width:var(--b);height:var(--b);border-radius:50%;background:var(--bubble);border:3px solid var(--moon);
  display:grid;place-items:center;font-family:var(--f-num);font-weight:800;font-size:calc(var(--b) * .38);
  font-variant-numeric:tabular-nums;color:var(--ink);padding:0;position:relative;transition:transform .15s}
.bub.we{font-weight:800}
.bub.ghost{background:transparent;border:2px dashed var(--moon-deep);color:var(--muted)}
.bub.ev{background:var(--moon);border-color:var(--moon)}
.bub.k{--b:20px;border-width:2px}
.bub.void{visibility:hidden}
button.bub{cursor:pointer}
button.bub:hover{transform:scale(1.08)}
.bub.multi::after{content:"";position:absolute;right:-2px;top:-2px;width:10px;height:10px;border-radius:50%;background:var(--ink);border:2px solid var(--paper)}
.bub.sel{outline:3px solid var(--ink);outline-offset:2px}
.wall.filtering .bub.on:not(.match){opacity:.3}
.wall.filtering .bub.match{transform:scale(1.1)}
.tbc{writing-mode:vertical-rl;font-weight:900;font-size:calc(var(--b) * .42);letter-spacing:.35em;color:var(--muted);
  border:2px dashed var(--moon-deep);border-radius:999px;width:var(--b);display:flex;align-items:center;justify-content:center;padding:14px 0}
button.tbc{font-family:inherit;background:transparent;cursor:pointer;transition:background .15s}
button.tbc:hover{background:var(--sheet)}
@media (prefers-reduced-motion:reduce){.track{transition:none}.pg[inert]{transition:none}}

/* aside */
aside{display:grid;gap:16px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 16px);max-height:calc(100dvh - 32px);overflow:auto;padding-right:2px;min-width:0}
@media (max-width:900px){aside{position:static;max-height:none;overflow:visible}}
.panel-title{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.panel-title h2{margin:0;font-weight:900;font-size:20px}
.linkbtn{border:0;background:none;padding:0;cursor:pointer;color:var(--muted);text-decoration:underline;font-size:13px}

.card{background:var(--sheet);border:2px solid var(--line);border-radius:18px;padding:16px 18px;display:grid;gap:10px;min-width:0}
.card-head{display:flex;gap:12px;align-items:center}
.key{display:flex;gap:16px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.key span{display:inline-flex;align-items:center;gap:6px}
.dbadge.ev{background:var(--moon);border-color:var(--moon)}
.dbadge{flex:none;width:52px;height:52px;border-radius:50%;background:var(--bubble);border:3px solid var(--moon);color:var(--ink);display:grid;place-items:center;text-align:center;line-height:1.05;font-family:var(--f-num)}
.dbadge b{font-size:20px;font-weight:800;display:block}
.dbadge small{font-size:10px;font-weight:500}
.card h3{margin:0;font-size:17px;font-weight:700;line-height:1.35}
.card .when{font-size:12px;color:var(--muted)}
.tags{display:flex;gap:6px;flex-wrap:wrap}
.tag{font-size:12px;border-radius:999px;padding:0 9px;background:var(--paper);border:1px solid var(--line)}
.moments{list-style:none;margin:0;padding:0;display:grid;gap:2px}
.mlink{display:flex;gap:10px;align-items:baseline;text-decoration:none;color:inherit;padding:4px 8px;border-radius:10px}
.mlink:hover{background:var(--paper)}
.mlink .t{font-family:var(--f-mono);font-size:12.5px;color:var(--ink);background:var(--moon);border-radius:6px;padding:0 6px;flex:none;font-variant-numeric:tabular-nums}
.mlink .l{min-width:0}
.mlink .go{margin-left:auto;font-size:12px;color:var(--muted);flex:none}
.hit .mlink{background:#FFF1B8}
mark{background:#FFE38A;color:inherit;border-radius:2px}
.card-foot{display:flex;gap:14px;flex-wrap:wrap;font-size:13px}
.card-foot a{color:var(--ink)}
.empty{border:2px dashed var(--moon-deep);border-radius:18px;padding:18px;color:var(--muted);display:grid;gap:8px}
.empty b{color:var(--ink)}
.notice{font-size:13px;color:var(--c6)}

@media (prefers-reduced-motion:reduce){.bub{transition:none}}
</style>
</head>
<body>
<div class="page">
  <header class="mast">
    <svg class="moon" viewBox="0 0 120 120" aria-hidden="true"><path d="M78 8A54 54 0 1 0 112 92 46 46 0 0 1 78 8Z" fill="var(--moon)"/></svg>
    <h1>一烨知秋纪事录</h1>
    <div class="sub"><span>听潮阁 · T.枫烨 × T.01</span><span>B站直播回放</span></div>
  </header>

  <div class="tools">
    <label class="search" for="q">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true"><circle cx="7" cy="7" r="5" stroke="currentColor" stroke-width="1.8"/><path d="M11 11l3.5 3.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      <input id="q" type="search" placeholder="搜事件或日期，例如：合唱、2026-03" autocomplete="off">
    </label>
    <div class="count" id="count">正在读取…</div>
  </div>

  <div class="main">
    <div class="poster"><div class="track" id="track">
      <div class="pg" id="pg1"><div class="wall" id="wall1"></div></div>
      <div class="pg" id="pg2" inert><div class="wall" id="wall2"></div></div>
    </div></div>
    <aside id="aside" aria-live="polite"></aside>
  </div>
</div>

<!-- 回放资料：要新增回放，改 replays.js 就好，这个文件不用动 -->
<script src="replays.js"></script>
<script>
const $=s=>document.querySelector(s);
const START="2025-10-30", END="2026-06-27", START2="2026-10-29";
function todayStr(){const t=new Date();return `${t.getFullYear()}-${String(t.getMonth()+1).padStart(2,"0")}-${String(t.getDate()).padStart(2,"0")}`;}
function monthsBetween(a,b){const out=[];let [y,m]=a.split("-").map(Number);m--;const [by,bm]=b.split("-").map(Number);
  while(y<by||(y===by&&m<=bm-1)){out.push([y,m]);m++;if(m>11){m=0;y++;}}return out;}
function end2(){return state.streams.map(s=>s.date).filter(d=>d>=START2).sort().pop()||START2;}
function pages(){return[
  {id:"wall1",start:START,end:END,months:monthsBetween(START,END),tail:"next"},
  {id:"wall2",start:START2,end:end2(),months:monthsBetween(START2,end2()),tail:"tbc",onlyData:true}];}
const MON=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const WEEK=["日","一","二","三","四","五","六"];
const COLORS=["var(--c2)","var(--c1)","var(--c3)","var(--c4)","var(--c5)","var(--c6)"];
const hasEv=st=>!!st.event||(st.tags||[]).includes("大事记");
const state={streams:[],q:"",tag:"",day:"",loaded:false,page:1};

/* ---------- helpers ---------- */
const pad=n=>String(n).padStart(2,"0");
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function fmt(s){const h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60;return(h?h+":":"")+String(m).padStart(h?2:1,"0")+":"+pad(x);}
const bvOf=u=>{const m=String(u).match(/BV[0-9A-Za-z]{10}/);return m?m[0]:null;};
function jumpUrl(st,mo){
  const src=(mo&&mo.url)||st.url;
  const bv=bvOf(src),ps=[];if(mo&&mo.p)ps.push("p="+mo.p);if(mo&&mo.s)ps.push("t="+mo.s);
  if(bv)return`https://www.bilibili.com/video/${bv}/`+(ps.length?"?"+ps.join("&"):"");
  let b=String(src).trim();if(!/^https?:\/\//.test(b))b="https://"+b;
  return ps.length?b+(b.includes("?")?"&":"?")+ps.join("&"):b;
}
function tagColors(){
  const cnt={};state.streams.forEach(s=>{const t=(s.tags||[])[0];if(t)cnt[t]=(cnt[t]||0)+1;});
  const order=Object.keys(cnt).sort((a,b)=>cnt[b]-cnt[a]);const map={};
  order.forEach((t,i)=>map[t]=COLORS[i%COLORS.length]);return{map,order};
}
function colorOf(st,map){const t=(st.tags||[])[0];return t&&map[t]||COLORS[0];}
function tokens(){return state.q.toLowerCase().split(/[\s,，]+/).filter(Boolean);}
function hl(text,toks){let h=esc(text);if(!toks.length)return h;
  const re=new RegExp("("+toks.map(t=>esc(t).replace(/[.*+?^${}()|[\]\\]/g,"\\$&")).join("|")+")","gi");return h.replace(re,"<mark>$1</mark>");}
function search(){
  const toks=tokens(),res=[];
  for(const st of state.streams){
    if(state.tag&&(st.tags||[])[0]!==state.tag&&!(st.tags||[]).includes(state.tag))continue;
    if(!toks.length){res.push({st,hits:null});continue;}
    const head=(st.date+" "+st.title+" "+(st.tags||[]).join(" ")).toLowerCase(),hits=new Set();
    (st.moments||[]).forEach((m,i)=>{const hay=(head+" "+m.label).toLowerCase();
      if(toks.every(t=>hay.includes(t))&&toks.some(t=>m.label.toLowerCase().includes(t)))hits.add(i);});
    if(hits.size||toks.every(t=>head.includes(t)))res.push({st,hits:hits.size?hits:null});
  }
  return res.sort((a,b)=>String(a.st.date).localeCompare(String(b.st.date)));
}

/* ---------- poster ---------- */
function renderWall(){
  const byDate={};state.streams.forEach(s=>(byDate[s.date]=byDate[s.date]||[]).push(s));
  const filtering=!!(tokens().length||state.tag);
  const matchDates=new Set(filtering?search().map(r=>r.st.date):[]);
  for(const pg of pages()){
    const cols=pg.months.map(([y,m],ci)=>{
      const days=new Date(y,m+1,0).getDate();
      const showYear=ci===0||m===0;
      let cells="";
      for(let d=1;d<=31;d++){
        const ds=`${y}-${pad(m+1)}-${pad(d)}`;
        if(ds<pg.start)continue;
        if(ds>pg.end){
          const prev=new Date(y,m,d-1),ps=`${prev.getFullYear()}-${pad(prev.getMonth()+1)}-${pad(prev.getDate())}`;
          if(ps===pg.end) cells+=pg.tail==="next"
            ?`<button class="tbc" id="nextCh" aria-label="第二章节，看 2026/10/29 之后的回放">第二章节</button>`
            :`<span class="tbc">未完待续</span>`;
          continue;
        }
        if(d>days){if(!pg.onlyData)cells+=`<span class="bub void"></span>`;continue;}
        const wd=new Date(y,m,d).getDay(),we=wd===0||wd===6?" we":"";
        const items=byDate[ds]||[];
        if(pg.onlyData&&!items.length)continue;
        const label=`${y}年${m+1}月${d}日 周${WEEK[wd]}`;
        if(items.length){
          const cls=["bub","on"];if(items.some(hasEv))cls.push("ev");if(items.length>1)cls.push("multi");if(ds===state.day)cls.push("sel");if(matchDates.has(ds))cls.push("match");
          cells+=`<button class="${cls.join(" ")}${we}" data-day="${ds}" title="${esc(label+" · "+items.map(s=>s.title).join(" / "))}" aria-label="${esc(label+"，"+items[0].title)}">${d}</button>`;
        }else{
          cells+=`<span class="bub ghost${we}" title="${label}">${d}</span>`;
        }
      }
      if(ci===pg.months.length-1&&pg.end===`${y}-${pad(m+1)}-31`)cells+=pg.tail==="next"?`<button class="tbc" id="nextCh">第二章节</button>`:`<span class="tbc">未完待续</span>`;
      return `<div class="col${ci%2?" odd":""}">
        <div class="col-head">${showYear?`<div class="yr">${String(y).split("").map(c=>`<span>${c}</span>`).join("")}</div>`:""}<div class="mo">${MON[m]}</div></div>
        <div class="cells">${cells}</div></div>`;
    }).join("");
    const wall=document.getElementById(pg.id);wall.innerHTML=cols+(pg.tail==="tbc"?`<div class="back-col"><button class="chbtn" id="prevCh">‹ 回到第一章</button></div>`:"");wall.classList.toggle("filtering",filtering);
  }
}
function goPage(n){
  state.page=n;
  $("#track").classList.toggle("p2",n===2);
  $("#pg1").inert=n!==1; $("#pg2").inert=n!==2;
  render();
  const top=$(".poster").getBoundingClientRect().top;
  if(top<0)window.scrollBy({top:top-12,behavior:matchMedia("(prefers-reduced-motion:reduce)").matches?"auto":"smooth"});
}

/* ---------- aside ---------- */
function card({st,hits},toks,map){
  const [y,m,d]=String(st.date).split("-").map(Number);
  const wd=WEEK[new Date(y,m-1,d).getDay()];
  const li=(st.moments||[]).map((mo,i)=>`<li class="${hits&&hits.has(i)?"hit":""}"><a class="mlink" href="${esc(jumpUrl(st,mo))}" target="_blank" rel="noopener">
    <span class="t">${mo.p?"P"+mo.p+" ":""}${fmt(mo.s||0)}</span><span class="l">${hl(mo.label,toks)}</span><span class="go">跳转 ↗</span></a></li>`).join("");
  return `<article class="card">
    <div class="card-head">
      <div class="dbadge${hasEv(st)?" ev":""}"><div><b>${d||"–"}</b><small>${MON[(m||1)-1]}</small></div></div>
      <div style="min-width:0"><h3>${hl(st.title,toks)}</h3><div class="when">${y} 年 ${m} 月 ${d} 日 · 周${wd}</div></div>
    </div>
    ${(st.tags||[]).length?`<div class="tags">${st.tags.map(t=>`<span class="tag">${hl(t,toks)}</span>`).join("")}</div>`:""}
    ${li?`<ol class="moments">${li}</ol>`:`<div class="when">还没有记录时间点</div>`}
    <div class="card-foot">${(st.moments||[]).some(m=>m.url)?"":`<a href="${esc(jumpUrl(st,null))}" target="_blank" rel="noopener">从头观看录屏 ↗</a>`}</div>
  </article>`;
}
function renderAside(){
  const aside=$("#aside");
  if(!state.loaded){aside.innerHTML="";return;}
  const {map,order}=tagColors(),toks=tokens(),filtering=!!(toks.length||state.tag);
  const legend=`<div class="key"><span><i class="bub ghost k"></i>没有录屏</span><span><i class="bub k"></i>有录屏</span><span><i class="bub ev k"></i>有录屏＋事件</span></div>`;
  let html="";
  if(filtering){
    const res=search();
    html=`<div class="panel-title"><h2>搜索结果</h2><button class="linkbtn" id="clearBtn">清空</button></div>${legend}`+
      (res.length?res.map(r=>card(r,toks,map)).join(""):`<div class="empty"><b>没找到</b>换个关键词试试，或点选别的颜色标签。</div>`);
  }else if(state.day){
    const items=state.streams.filter(s=>s.date===state.day);
    const [y,m,d]=state.day.split("-").map(Number);
    html=`<div class="panel-title"><h2>${m} 月 ${d} 日</h2><button class="linkbtn" id="backBtn">返回总览</button></div>`+
      items.map(st=>card({st,hits:null},[],map)).join("");
  }else{
    const recent=[...state.streams].sort((a,b)=>String(b.date).localeCompare(String(a.date))).slice(0,3);
    html=(recent.length?`<div class="panel-title"><h2>最近的回放</h2></div>`+recent.map(st=>card({st,hits:null},[],map)).join(""):
      `<div class="empty"><b>还没有收录回放</b>整理者添加录屏后，泡泡就会亮起来。</div>`);
  }
  aside.innerHTML=html;
}
function render(){
  renderWall();renderAside();
  if(!state.loaded)return;
  const pg=pages()[state.page-1];
  const inRange=state.streams.filter(s=>s.date>=pg.start&&s.date<=pg.end).length;
  const e2=end2().split("-").map(Number);const rng=state.page===1?"2025/10/30 – 2026/6/27":`2026/10/29 – ${e2[0]}/${e2[1]}/${e2[2]}`;
  const toks=tokens();
  if(toks.length||state.tag){const r=search();$("#count").textContent=r.length?`找到 ${r.length} 场回放，已在泡泡墙上放大标出`:"没有符合的回放";}
  else $("#count").textContent=inRange?`${rng} · 共收录 ${inRange} 场回放`:`${rng} · 还没有收录回放`;
}

/* ---------- events ---------- */
let qT;$("#q").addEventListener("input",e=>{clearTimeout(qT);qT=setTimeout(()=>{state.q=e.target.value;render();},120);});
const narrow=()=>matchMedia("(max-width:900px)").matches;
document.addEventListener("click",e=>{
  const dy=e.target.closest("[data-day]");
  if(dy){state.day=state.day===dy.dataset.day?"":dy.dataset.day;state.q="";state.tag="";$("#q").value="";render();
    if(state.day&&narrow())$("#aside").scrollIntoView({behavior:matchMedia("(prefers-reduced-motion:reduce)").matches?"auto":"smooth",block:"start"});return;}
  const tg=e.target.closest("[data-tag]");if(tg){state.tag=state.tag===tg.dataset.tag?"":tg.dataset.tag;state.day="";render();return;}
  if(e.target.id==="clearBtn"){state.q="";state.tag="";$("#q").value="";render();}
  if(e.target.id==="backBtn"){state.day="";render();}
  if(e.target.closest("#nextCh")){goPage(2);return;}
  if(e.target.closest("#prevCh")){goPage(1);return;}
});

/* ---------- 读取 replays.js ---------- */
function normDate(d){
  const m=String(d||"").trim().match(/^(\d{4})[-/.](\d{1,2})[-/.](\d{1,2})$/);
  return m?`${m[1]}-${pad(m[2])}-${pad(m[3])}`:null;
}
function toMoment(item,who){
  const o=typeof item==="string"?{url:item}:(item||{});
  const raw=String(o.url||"");
  const url=(raw.match(/https?:\/\/[^\s"'<>]+/)||[raw.trim()])[0];
  if(!url)return null;
  const t=url.match(/[?&]t=(\d+(?:\.\d+)?)/), p=url.match(/[?&]p=(\d+)/);
  const bv=bvOf(url);
  const name=who==="t01"?"T.01 视角":"T.枫烨 视角";
  const mo={s:t?Math.floor(Number(t[1])):0,label:o.label||(name+(o.note?`（${o.note}）`:"")),
    url:bv?`https://www.bilibili.com/video/${bv}/`:url};
  if(p&&p[1]!=="1")mo.p=Number(p[1]);
  return mo;
}
function loadReplays(list){
  const out=[];
  (Array.isArray(list)?list:[]).forEach((r,i)=>{
    const date=normDate(r&&r.date);
    if(!date){console.warn("replays.js 第 "+(i+1)+" 笔的日期看不懂：",r);return;}
    const ev=String(r.event||"").trim();
    const moments=[...(r.t01||[]).map(x=>toMoment(x,"t01")),...(r.fengye||[]).map(x=>toMoment(x,"fengye"))].filter(Boolean);
    if(!moments.length){console.warn("replays.js "+date+" 没有录屏链接，已略过");return;}
    const who=[];if((r.t01||[]).length)who.push("T.01");if((r.fengye||[]).length)who.push("T.枫烨");
    const [,m,d]=date.split("-").map(Number);
    out.push({id:date+"#"+i,date,title:ev||`${m}月${d}日 连线`,url:moments[0].url,tags:[ev?"大事记":"日常",...who],moments});
  });
  return out;
}

/* ---------- 启动 ---------- */
if(Array.isArray(window.REPLAYS)){
  state.streams=loadReplays(window.REPLAYS);state.loaded=true;render();
}else{
  state.loaded=true;render();
  $("#count").innerHTML=`<span class="notice">读不到 replays.js。请确认它和 index.html 放在同一个文件夹，而且内容没有少了逗号或括号。</span>`;
}
</script>
